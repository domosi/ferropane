name: Build & Publish macOS Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (e.g. v1.0.0)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build FerroPane (macOS Apple Silicon)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain (aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Run Rust unit tests
        run: |
          cd rust
          cargo test --release

      - name: Install Flutter dependencies & package .dmg / .zip
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          chmod +x scripts/run_macos_no_xcode.sh scripts/package_release.sh
          ./scripts/package_release.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FerroPane-macos-arm64
          path: |
            build/dist/FerroPane-macos-arm64.dmg
            build/dist/FerroPane-macos-arm64.zip
            build/dist/SHA256SUMS.txt

      - name: Determine Release Tag
        id: release_meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          NOTES="### Download FerroPane for macOS (Apple Silicon M1/M2/M3/M4)
          - **Installer Disk Image:** \`FerroPane-macos-arm64.dmg\` (Open and drag \`FerroPane.app\` to \`Applications\`)
          - **Portable Zip Archive:** \`FerroPane-macos-arm64.zip\`

          > **First Launch Note (macOS Gatekeeper):** Because this open-source build is ad-hoc signed without a paid Apple Developer ID certificate, run this once after copying \`FerroPane.app\` to \`/Applications\`:
          > \`\`\`zsh
          > xattr -cr /Applications/FerroPane.app
          > \`\`\`"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              build/dist/FerroPane-macos-arm64.dmg \
              build/dist/FerroPane-macos-arm64.zip \
              build/dist/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$TAG" \
              build/dist/FerroPane-macos-arm64.dmg \
              build/dist/FerroPane-macos-arm64.zip \
              build/dist/SHA256SUMS.txt \
              --title "FerroPane ($TAG)" \
              --notes "$NOTES"
          fi
