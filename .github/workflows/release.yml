name: Build & Publish macOS Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (e.g. v1.2.0)'
        required: false
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build, Sign & Notarize FerroPane (macOS Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain (aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Import Apple Developer ID Certificate into Ephemeral Keychain
        if: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' }}
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ferropane-signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Run Rust unit tests
        run: |
          cd rust
          cargo test --release

      - name: Build, Sign & Notarize .dmg and .zip
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          chmod +x scripts/run_macos_no_xcode.sh scripts/package_release.sh
          ./scripts/package_release.sh

      - name: Clean up Ephemeral Keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/ferropane-signing.keychain-db" "$RUNNER_TEMP/certificate.p12"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FerroPane-macos-arm64
          path: |
            build/dist/FerroPane-macos-arm64.dmg
            build/dist/FerroPane-macos-arm64.zip
            build/dist/SHA256SUMS.txt

      - name: Determine Release Tag
        id: release_meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.2.0"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish Signed & Notarized Assets to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          NOTES="### Download FerroPane for macOS (Apple Silicon M1/M2/M3/M4)
          - **Signed & Apple-Notarized Installer Disk Image:** \`FerroPane-macos-arm64.dmg\` (Open and drag \`FerroPane.app\` to \`Applications\`)
          - **Signed & Apple-Notarized Zip Archive:** \`FerroPane-macos-arm64.zip\`"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              build/dist/FerroPane-macos-arm64.dmg \
              build/dist/FerroPane-macos-arm64.zip \
              build/dist/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$TAG" \
              build/dist/FerroPane-macos-arm64.dmg \
              build/dist/FerroPane-macos-arm64.zip \
              build/dist/SHA256SUMS.txt \
              --title "FerroPane ($TAG)" \
              --notes "$NOTES"
          fi
